<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Figtree:wght@700;800&display=block" rel="stylesheet">
<style>
  /* Entrata scenica del video (30 s): 360×640 css, fotografata a 1080×1920. disegna(t) mette tutto al secondo t. */
  html, body { margin: 0; width: 360px; height: 640px; overflow: hidden; background: #041a4d; }
  #scena { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 45%; }
  .acqua { position: absolute; left: -14px; top: -10px; width: 390px; }
  #sopra { mix-blend-mode: screen; opacity: 0.5; }
  #fondo { position: absolute; inset: 0; filter: blur(2.2px); }
  #fondo div { position: absolute; background: #041d57; border-radius: 4px; opacity: 0.85; }
  #corde { position: absolute; inset: 0; }
  #ombre { position: absolute; inset: 0; filter: blur(6px); }
  #ombre div { position: absolute; top: -20px; width: 22px; height: 700px; background: #041a4d; opacity: 0.25; border-radius: 8px; }
  #titolo { position: absolute; top: 74px; width: 100%; text-align: center; font: 900 54px/1 'Cinzel Decorative', serif;
    text-shadow: 0 0 6px #fff, 0 0 14px #fff, 0 0 24px rgba(255,255,255,0.8); }
  #titolo .s { color: #0a1a2f } #titolo .l { color: #2563eb }
  #motto { position: absolute; bottom: 70px; width: 100%; text-align: center; color: #fff; font: 800 23px/1.3 Figtree, sans-serif;
    text-shadow: 0 2px 14px rgba(4,26,77,0.8); }
  #buio { position: absolute; inset: 0; background: #041a4d; pointer-events: none; }
</style>
</head>
<body>
<div id="scena">
  <img class="acqua" id="acqua" src="acqua.png" alt="">
  <div id="fondo">
    <div id="linea"></div><div id="t"></div><div id="diag"></div><div id="barra"></div>
  </div>
  <img class="acqua" id="sopra" src="acqua.png" alt="">
  <div id="ombre"><div style="left: 104px"></div><div style="left: 274px"></div></div>
  <svg id="corde" width="360" height="640" viewBox="0 0 360 640"></svg>
  <div id="titolo"><span class="s">Swim</span><span class="l">Line</span></div>
  <div id="motto">I tuoi tempi.<br>La tua squadra.</div>
  <div id="buio"></div>
</div>
<script>
  // galleggianti a dischi dentati, colori della corda vera: rossi alle estremità, bianchi, poi blu
  const COLORI = { rosso: ['#7a0d08', '#d42a1e', '#ff6a55'], bianco: ['#8d9bb0', '#eef1f6', '#ffffff'], notte: ['#0b1550', '#1b2f8f', '#3f5bd0'], blu: ['#12308a', '#2a62de', '#6b9bff'] }
  const svg = document.getElementById('corde')
  let defs = '<defs>'
  for (const [n, [s, c, l]] of Object.entries(COLORI)) defs += `<linearGradient id="g${n}" x1="0" x2="1"><stop offset="0" stop-color="${s}"/><stop offset="0.3" stop-color="${c}"/><stop offset="0.48" stop-color="${l}"/><stop offset="0.7" stop-color="${c}"/><stop offset="1" stop-color="${s}"/></linearGradient>`
  defs += '</defs>'
  const disco = 'M-9 -5 L9 -5 L12 -3.4 L14.5 -3.8 L13 -1.4 L15 0 L13 1.4 L14.5 3.8 L12 3.4 L9 5 L-9 5 L-12 3.4 L-14.5 3.8 L-13 1.4 L-15 0 L-13 -1.4 L-14.5 -3.8 L-12 -3.4 Z'
  let corde = ''
  for (const x of [95, 265]) {
    corde += `<g class="corda"><line x1="${x}" y1="-700" x2="${x}" y2="660" stroke="#0b1550" stroke-width="1.4" opacity="0.5"/>`
    for (let y = -4, k = 0; y < 652; y += 11, k++) {
      const c = y < 90 || y > 590 ? 'rosso' : y < 250 ? 'bianco' : ['notte', 'notte', 'bianco', 'blu', 'blu', 'bianco'][k % 6]
      corde += `<path transform="translate(${x} ${y})" d="${disco}" fill="url(#g${c})" stroke="${COLORI[c][0]}" stroke-width="0.8"/>`
    }
    corde += '</g>'
  }
  svg.innerHTML = defs + corde

  const tra = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)))
  const morbido = (x) => x * x * (3 - 2 * x)
  const $ = (id) => document.getElementById(id)
  const pos = (el, x, y, w, h) => Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' })

  window.disegna = (t) => {
    // l'acqua scorre piano per tutto il tempo
    const y = -t * 7
    $('acqua').style.transform = `translateY(${y}px)`
    $('sopra').style.transform = `translateY(${y}px)`
    $('buio').style.opacity = 1 - morbido(tra(t, 0, 3))
    // le corde entrano dall'alto
    const c = morbido(tra(t, 2.5, 7.5))
    for (const g of document.querySelectorAll('.corda')) g.setAttribute('transform', `translate(0 ${-660 * (1 - c)})`)
    document.querySelectorAll('#ombre div').forEach((d) => { d.style.transform = `translateY(${-660 * (1 - c)}px)` })
    // la linea sul fondo si disegna verso il basso, poi la T
    const l = morbido(tra(t, 8, 12))
    pos($('linea'), 169, 150, 22, 440 * l)
    const tt = morbido(tra(t, 11.6, 12.6))
    pos($('t'), 180 - 50 * tt, 580, 100 * tt, 22)
    // il 4 nasce dalla linea: prima la diagonale, poi il trattino
    const d = morbido(tra(t, 12.8, 14.6))
    const lung = 150 * d
    Object.assign($('diag').style, { left: '180px', top: '300px', width: lung + 'px', height: '22px', transformOrigin: '0 50%', transform: 'rotate(126deg) translateY(-11px)' })
    const b = morbido(tra(t, 14.4, 15.8))
    pos($('barra'), 88, 409, 150 * b, 22)
    // il nome
    const n = morbido(tra(t, 16.5, 20))
    Object.assign($('titolo').style, { opacity: n, transform: `scale(${0.88 + 0.12 * n})`, letterSpacing: `${(1 - n) * 8}px` })
    // il motto
    const m = morbido(tra(t, 21.5, 23.5))
    Object.assign($('motto').style, { opacity: m, transform: `translateY(${(1 - m) * 16}px)` })
    // avvicinamento finale
    $('scena').style.transform = `scale(${1 + 0.05 * morbido(tra(t, 24, 30))})`
  }
  disegna(0)
</script>
</body>
</html>
